<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ảnh thẻ · PHOTO NOIR</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bd: #e5e5e5; --mu: #666; }
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Inter', sans-serif; color: #111; background: #fafafa; }
header { padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--bd); display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 15px; margin: 0; letter-spacing: .5px; text-transform: uppercase; flex: 1; }
#dong { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--bd); background: #fff; font: 400 24px/1 'Inter'; color: #111; cursor: pointer; display: none; }
/* bảng chọn ảnh: ảnh của lượt chụp + chọn từ máy */
#bang-anh { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; }
#bang-anh.on { display: flex; }
#bang-anh .hop { background: #fff; width: 100%; max-width: 640px; max-height: 86vh; border-radius: 16px 16px 0 0; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
#bang-anh .dau { display: flex; align-items: center; justify-content: space-between; font: 700 14px 'Inter'; }
#bang-anh .luoi { overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
#bang-anh .luoi button { padding: 0; border: 0; background: #f4f4f5; aspect-ratio: 3 / 4; border-radius: 8px; overflow: hidden; cursor: pointer; }
#bang-anh .luoi img { width: 100%; height: 100%; object-fit: cover; display: block; }
#bang-anh .trong { font-size: 13px; color: var(--mu); text-align: center; padding: 18px 0; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px; max-width: 1100px; margin: 0 auto; }
.card { background: #fff; border: 1px solid var(--bd); border-radius: 14px; padding: 16px; min-width: 0; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; margin: 0 0 12px; }
.chon-anh { width: 100%; border: 2px dashed #d4d4d8; border-radius: 12px; padding: 26px 10px; text-align: center; font: 600 14px 'Inter'; color: #111; background: #fff; cursor: pointer; }
.chon-anh small { display: block; font-weight: 400; font-size: 12px; color: var(--mu); margin-top: 4px; }
.chon-anh.nho { padding: 10px; border-style: solid; font-size: 13px; }
/* Khung xem ảnh thẻ + màn chờ có vòng xoay */
#khung { position: relative; display: flex; justify-content: center; margin-top: 14px; min-height: 0; }
#khung canvas, #khung img.goc { max-width: 100%; max-height: 60vh; height: auto; box-shadow: 0 2px 10px rgba(0,0,0,.12); background: #fff; display: block; }
#khung img.goc { filter: blur(2px) brightness(.85); }
#cho { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; color: #fff; padding: 16px; }
#cho.on { display: flex; background: rgba(0,0,0,.28); }
#cho .xoay { width: 44px; height: 44px; border-radius: 50%; border: 4px solid rgba(255,255,255,.35); border-top-color: #fff; animation: xoay .8s linear infinite; }
@keyframes xoay { to { transform: rotate(360deg); } }
#cho b { font-size: 15px; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
#cho span { font-size: 13px; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
#cho .vach { width: 70%; max-width: 240px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.35); overflow: hidden; display: none; }
#cho .vach i { display: block; height: 100%; width: 0; background: #fff; transition: width .3s; }
#cho.toi { position: static; color: #111; min-height: 220px; }
#cho.toi .xoay { border-color: #e4e4e7; border-top-color: #111; }
#cho.toi b, #cho.toi span { text-shadow: none; }
#cho.toi .vach { background: #e4e4e7; }
#cho.toi .vach i { background: #111; }
.nhan { text-align: center; font-size: 12px; color: var(--mu); margin: 10px 0 0; }
#to { max-width: 100%; height: auto; box-shadow: 0 2px 10px rgba(0,0,0,.12); display: block; margin: 0 auto; }
.dong { margin-bottom: 16px; }
.dong > label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 8px; }
.dong > label b { font-weight: 500; color: var(--mu); }
.dong input[type=range] { width: 100%; accent-color: #111; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 10px 12px; border: 1px solid var(--bd); border-radius: 9px; background: #fff; font: 600 13px 'Inter'; cursor: pointer; color: #111; }
.chip.on { background: #111; color: #fff; border-color: #111; }
.mau { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--bd); cursor: pointer; }
.mau.on { border-color: #111; box-shadow: 0 0 0 3px #fff inset; }
button.lon { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #111; background: #111; color: #fff; font: 700 13px 'Inter'; cursor: pointer; text-transform: uppercase; margin-top: 8px; }
button.lon.phu { background: #fff; color: #111; }
button.lon:disabled { opacity: .35; cursor: default; }
.hai { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.hai button.lon { font-size: 12px; padding: 12px 6px; }
.goiy { font-size: 12px; color: #888; line-height: 1.5; margin: 6px 0 0; }
details { margin-top: 18px; border-top: 1px solid var(--bd); padding-top: 14px; }
details summary { font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 14px; }
.to-wrap { grid-column: 1 / -1; }
#mac-dinh { padding: 7px 12px; margin-top: 2px; }
/* Cọ xoá viền: bôi trên ảnh thẻ */
#khung canvas.boi { touch-action: none; cursor: crosshair; outline: 2px dashed #e0245e; outline-offset: 2px; }
.chip:disabled { opacity: .35; cursor: default; }
/* vòng cọ theo ngón tay + kính lúp góc ảnh (ngón tay che chỗ đang sửa) */
#vong { position: absolute; z-index: 3; pointer-events: none; display: none; border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.55); }
#nguon { position: absolute; z-index: 3; pointer-events: none; display: none; width: 22px; height: 22px; transform: translate(-50%, -50%); }
#nguon::before, #nguon::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
#nguon::before { left: 10px; top: 0; width: 2px; height: 22px; }
#nguon::after { top: 10px; left: 0; height: 2px; width: 22px; }
#nguon.chon { width: 30px; height: 30px; border: 2px dashed #fff; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
#nguon.chon::before { left: 12px; top: 5px; height: 16px; } #nguon.chon::after { top: 12px; left: 5px; width: 16px; }
#kinh { position: absolute; z-index: 4; top: 6px; left: 6px; width: 120px; height: 120px; pointer-events: none; display: none; border-radius: 50%; overflow: hidden; border: 3px solid #fff; box-shadow: 0 2px 12px rgba(0,0,0,.35); background: #eee; }
#kinh canvas { width: 100%; height: 100%; display: block; }
/* thanh công cụ icon dưới ảnh */
#thanh-cu { display: none; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
#thanh-cu.co { display: flex; }
.icu { width: 44px; height: 44px; padding: 0; border-radius: 12px; border: 1px solid var(--bd); background: #fff; color: #111; display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s; }
.icu svg, #boi-co svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icu.on { background: #111; color: #fff; border-color: #111; }
.icu:disabled { opacity: .3; cursor: default; }
#so-sanh { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#khung.truoc::after { content: 'Trước'; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 4; background: rgba(0,0,0,.62); color: #fff; font: 600 12px 'Inter'; padding: 3px 12px; border-radius: 20px; pointer-events: none; }
.vach-dung { width: 1px; height: 26px; background: var(--bd); }
#boi-co { display: none; flex-basis: 100%; align-items: center; gap: 8px; padding: 0 4px; color: #555; }
@media (max-width: 430px) { #thanh-cu { gap: 5px; } .icu { width: 38px; height: 38px; border-radius: 10px; } .icu svg { width: 20px; height: 20px; } .vach-dung { height: 22px; } }
#boi-co svg.nho { width: 16px; height: 16px; }
#boi-co input { flex: 1; min-width: 0; accent-color: #111; }
body.suatay #khung canvas { max-height: 55vh; }
/* phóng to bằng 2 ngón: chỉ trong lúc sửa tay, ảnh không tràn ra ngoài khung */
body.suatay #khung { overflow: hidden; padding: 4px 0; }
#khung > canvas { transform-origin: 0 0; }
/* Bảng số ảnh từng khổ trên tờ in */
.to-so { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px; }
.to-so .o { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--bd); border-radius: 10px; padding: 6px 8px; font: 600 13px 'Inter'; }
.to-so .o.co { border-color: #111; }
.to-so button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--bd); background: #fff; font: 700 18px 'Inter'; color: #111; cursor: pointer; }
.to-so button:disabled { opacity: .3; cursor: default; }
.to-so b { min-width: 22px; text-align: center; }
@media (max-width: 800px) {
    header { padding: 12px 16px; }
    main { grid-template-columns: minmax(0, 1fr); padding: 12px; gap: 12px; }
    /* khung ảnh dính trên cùng khi kéo xuống phần chỉnh: vừa kéo vừa thấy ảnh đổi */
    main > .card:first-child { position: sticky; top: 0; z-index: 5; padding: 10px 12px; border-radius: 0 0 14px 14px; box-shadow: 0 6px 16px rgba(0,0,0,.08); }
    main > .card:first-child h3 { display: none; }
    #khung { margin-top: 8px; }
    #khung canvas, #khung img.goc { max-height: 34vh; }
    .nhan { margin-top: 6px; }
}
</style>
</head>
<body>
<header>
    <h1>Làm ảnh thẻ</h1>
    <button type="button" id="dong" aria-label="Đóng">&times;</button>
</header>
<div id="bang-anh" role="dialog" aria-label="Chọn ảnh">
    <div class="hop">
        <div class="dau"><span>Chọn 1 ảnh chân dung</span><button type="button" class="chip" id="bang-dong">Đóng</button></div>
        <div class="luoi" id="luoi-anh"></div>
        <button type="button" class="lon phu" id="tu-may">Chọn ảnh từ máy</button>
    </div>
</div>
<main>
    <div class="card">
        <h3>Ảnh thẻ của bạn</h3>
        <button type="button" class="chon-anh" id="nut-chon">Chọn 1 ảnh chụp chân dung<small>Nhìn thẳng, thấy rõ mặt và vai</small></button>
        <input type="file" id="chon" accept="image/*" hidden>
        <div id="khung">
            <div id="cho"><div class="xoay"></div><b id="cho-chu"></b><span id="cho-phu"></span><div class="vach"><i></i></div></div>
            <div id="vong"></div><div id="nguon"></div><div id="kinh"><canvas width="240" height="240"></canvas></div>
        </div>
        <p class="nhan" id="nhan"></p>
        <div id="thanh-cu" role="toolbar" aria-label="Sửa tay">
            <button type="button" class="icu" id="so-sanh" title="Giữ để xem lúc vừa xoá phông" aria-label="Giữ để xem lúc vừa xoá phông"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7z" fill="currentColor"/></svg></button>
            <span class="vach-dung"></span>
            <button type="button" class="icu" id="cu-xoa" title="Xoá viền tóc chưa sạch" aria-label="Xoá viền" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
            <button type="button" class="icu" id="cu-va" title="Vá tóc: tô chỗ thiếu tóc (giữ ngón tay để chọn chỗ lấy tóc)" aria-label="Vá tóc" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 22h14"/><path d="M19.27 13.73A2.5 2.5 0 0 0 17.5 13h-11A2.5 2.5 0 0 0 4 15.5V17a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1.5c0-.66-.26-1.3-.73-1.77Z"/><path d="M14 13V8.5C14 7 15 7 15 5a3 3 0 0 0-3-3c-1.69 0-3 1-3 3s1 2 1 3.5V13"/></svg></button>
            <button type="button" class="icu" id="cu-keo" title="Kéo tóc chỉa vào trong" aria-label="Kéo tóc vào" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-6-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></button>
            <span class="vach-dung"></span>
            <button type="button" class="icu" id="boi-lui" title="Hoàn tác" aria-label="Hoàn tác" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
            <button type="button" class="icu" id="boi-toi" title="Làm lại" aria-label="Làm lại" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
            <button type="button" class="icu" id="boi-het" title="Bỏ hết, về ảnh ban đầu" aria-label="Bỏ hết" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
            <div id="boi-co"><svg viewBox="0 0 24 24" class="nho" aria-hidden="true"><circle cx="12" cy="12" r="3"/></svg><input type="range" id="co-cu" min="0.4" max="2.5" step="0.05" value="1" aria-label="Cỡ cọ"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg></div>
        </div>
    </div>

    <div class="card">
        <div class="dong"><label>Cỡ ảnh</label><div class="chips" id="kho"></div></div>
        <div class="dong"><label>Màu nền</label><div class="chips" id="nen"></div></div>
        <div class="dong"><label>Tóc</label><div class="chips" id="toc"></div>
            <p class="goiy" id="toc-goiy">Phần mềm tự chọn theo kiểu tóc, bấm để đổi.</p></div>
        <button class="lon" id="gui" disabled>Gửi cho tiệm in</button>
        <div class="hai">
            <button class="lon phu" id="tai-the" disabled>Lưu ảnh thẻ</button>
            <button class="lon phu" id="tai-to" disabled>Lưu tờ in</button>
        </div>
        <details id="chinh-anh">
            <summary>Chỉnh thêm</summary>
            <div class="dong"><label>Cỡ khuôn mặt <b id="v-dau"></b></label><input type="range" id="dau" min="-10" max="10" step="1" value="0"></div>
            <div class="dong"><label>Khoảng trống trên đầu <b id="v-tren"></b></label><input type="range" id="tren" min="-8" max="10" step="1" value="0"></div>
            <div class="dong"><label>Độ mềm viền vai áo <b id="v-mem"></b></label><input type="range" id="mem" min="0" max="100" step="10" value="30"></div>
            <button type="button" class="chip" id="mac-dinh">Về mặc định</button>
        </details>
    </div>


    <div class="card to-wrap" id="to-card" style="display:none;">
        <h3>Tờ in 10×15</h3>
        <div class="to-so" id="to-so"></div>
        <div id="to-o"></div>
        <p class="nhan" id="to-nhan"></p>
    </div>
</main>
<script type="module">
import { napMoHinh, xuLy, chinhNhanh, suaToc, doanToc, catThe, xepTo } from './anhthe-core.js';

// Khổ ảnh hồ sơ (mm) + cỡ khuôn mặt (đỉnh tóc -> cằm, % chiều cao) và khoảng trống trên đầu mặc định.
// 3.5×4.5 và 5×5 theo chuẩn visa/hộ chiếu quốc tế (mặt to hơn ảnh thẻ thường).
const KHO = {
    '2×3':            { w: 20, h: 30, dau: 56, tren: 10 },
    '3×4':            { w: 30, h: 40, dau: 56, tren: 10 },
    '4×6':            { w: 40, h: 60, dau: 56, tren: 10 },
    '3.5×4.5':        { w: 35, h: 45, dau: 74, tren: 7 },
    '5×5':            { w: 50, h: 50, dau: 60, tren: 10 }
};
const NEN = { 'Trắng': '#ffffff', 'Xanh': '#1f5fbf', 'Xanh nhạt': '#cfe3f7', 'Xám': '#d9d9d9' };
let kho = '4×6', nen = '#ffffff';
let ANH = null;            // { file, url, r, loi }
const $ = id => document.getElementById(id);

$('kho').innerHTML = Object.keys(KHO).map(k => `<button class="chip${k === kho ? ' on' : ''}" data-k="${k}">${k}</button>`).join('');
$('nen').innerHTML = Object.entries(NEN).map(([t, m]) => `<button class="mau${m === nen ? ' on' : ''}" title="${t}" aria-label="Nền ${t}" data-m="${m}" style="background:${m}"></button>`).join('');
$('kho').onclick = e => {
    const b = e.target.closest('[data-k]'); if (!b) return;
    kho = b.dataset.k; [...$('kho').children].forEach(x => x.classList.toggle('on', x === b));
    // Tờ in đang tự động (chưa bấm +/-): đổi sang toàn khổ mới
    if (TU_DONG) SO = {};
    ve();
};
$('nen').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; nen = b.dataset.m; [...$('nen').children].forEach(x => x.classList.toggle('on', x === b)); ve(); };


// ---------- Tóc: 3 mức sửa (làm trên kết quả tách, tính một lần cho mỗi mức rồi nhớ) ----------
const TOC = [[0, 'Tự nhiên'], [2, 'Gọn'], [3, 'Rất gọn']];
const MUC_DOAN = { xoan: 0, ngan: 2, dai: 3 }, TEN_DOAN = { xoan: 'tóc xoăn', ngan: 'tóc ngắn', dai: 'tóc dài' };
$('toc').innerHTML = TOC.map(([v, t]) => `<button type="button" class="chip" data-v="${v}">${t}</button>`).join('');
const veNutToc = () => [...$('toc').children].forEach(b => b.classList.toggle('on', ANH && +b.dataset.v === ANH.muc));
// ảnh đang hiện = kết quả tách + mức sửa tóc đang chọn
const apToc = () => { if (!ANH || !ANH.goc) return; ANH.r = !ANH.muc ? ANH.goc : (ANH.cache[ANH.muc] || (ANH.cache[ANH.muc] = suaToc(ANH.goc, ANH.muc))); };
const doiToc = async m => {
    if (!ANH || !ANH.goc || dangChay) return;
    ANH.muc = m; veNutToc();
    if (m && !ANH.cache[m]) { dangChay = true; buoc = 'gon'; duKien = 0; cho(true); veCho(); await new Promise(r => setTimeout(r, 30)); apToc(); cho(false); dangChay = false; }
    else apToc();
    ve();
};
$('toc').onclick = e => { const b = e.target.closest('[data-v]'); if (b) doiToc(+b.dataset.v); };
const nhanChinh = () => { const m = +$('mem').value; $('v-mem').innerText = m < 30 ? 'Sắc' : m < 70 ? 'Vừa' : 'Mềm'; };
nhanChinh();
// Độ mềm viền vai áo: đang kéo hiện ngay bản tách (nhẹ); thả tay làm lại mức tóc đang chọn
let rafVien = 0;
$('mem').oninput = () => {
    nhanChinh();
    if (!ANH || !ANH.goc || !ANH.goc.dung || dangChay) return;
    if (!rafVien) rafVien = requestAnimationFrame(() => { rafVien = 0; ANH.goc = chinhNhanh(ANH.goc, 0, +$('mem').value); ANH.cache = {}; ANH.r = ANH.goc; ANH.r._nhanh = true; veTheNhanh(); delete ANH.r._nhanh; });
};
$('mem').onchange = async () => {
    if (!ANH || !ANH.goc || !ANH.goc.dung) return;
    ANH.goc = chinhNhanh(ANH.goc, 0, +$('mem').value); ANH.cache = {};
    await doiToc(ANH.muc);
};

// ---------- Mở trong trang khách (khung nhúng): nhận ảnh lượt chụp, nhờ trang khách tải tờ in lên ----------
const NHUNG = window.parent !== window;
const guiCha = m => window.parent.postMessage(m, location.origin);
let ALBUM = [], choAnh = null, choGui = null;

// Chỉ vẽ lại ảnh thẻ (lúc đang kéo thanh): nhanh, tờ in vẽ sau khi buông tay
// Công cụ đang bật ('' | 'xoa' | 'keo'): thao tác trên ảnh thẻ (toạ độ màn hình -> ảnh thẻ -> lớp người theo đúng cách catThe đặt người vào khung)
let CU = '', coBoi = 1;
const nutBoi = () => {
    for (const [id, c] of [['cu-xoa', 'xoa'], ['cu-va', 'va'], ['cu-keo', 'keo']]) { $(id).classList.toggle('on', CU === c); $(id).setAttribute('aria-pressed', CU === c); }
    $('boi-co').style.display = CU ? 'flex' : 'none'; document.body.classList.toggle('suatay', !!CU); if (!CU) anVong();
    const n = k => !!(ANH && ANH[k] && ANH[k].length); $('boi-lui').disabled = !n('lui'); $('boi-toi').disabled = !n('toi'); $('boi-het').disabled = !n('tt'); if (THE) THE.classList.toggle('boi', !!CU);
};
// Phóng to: s = độ phóng, (x, y) = dịch (px CSS). Chỉ khi đang sửa tay; tắt công cụ là về như cũ.
let ZOOM = { s: 1, x: 0, y: 0 };
const apZoom = cv => { if (cv) cv.style.transform = ZOOM.s > 1.001 ? `translate(${ZOOM.x}px, ${ZOOM.y}px) scale(${ZOOM.s})` : ''; };
const boZoom = () => { ZOOM = { s: 1, x: 0, y: 0 }; apZoom(THE); };
const chonCu = c => { if (!ANH || !ANH.r) return; const cu = CU; CU = CU === c ? '' : c; ANH.vaLech = null; anNguon(); if (!CU) boZoom(); if (!cu !== !CU) ve(); nutBoi(); };
$('cu-xoa').onclick = () => chonCu('xoa'); $('cu-va').onclick = () => chonCu('va'); $('cu-keo').onclick = () => chonCu('keo');
// Bán kính cọ theo toạ độ lớp người (theo cỡ mặt nên ảnh to nhỏ nào cũng như nhau)
const banKinh = loai => { const r = ANH.r, fw = Math.hypot(r.matP.x - r.matT.x, r.matP.y - r.matT.y) * 2.2; return Math.max(3, (loai === 'keo' ? 0.1 : loai === 'va' ? 0.06 : 0.05) * fw * coBoi); };
// Vòng cọ: (cx, cy) là toạ độ CSS trong ảnh thẻ đang hiện
const tiLeCss = cv => cv.__hinh().k * cv.getBoundingClientRect().width / cv.width;
function hienVong(cv, cx, cy) {
    const v = $('vong'), kr = $('khung').getBoundingClientRect(), rc = cv.getBoundingClientRect(), d = 2 * banKinh(CU) * tiLeCss(cv);
    v.style.width = v.style.height = d + 'px'; v.style.left = (rc.left - kr.left + cx) + 'px'; v.style.top = (rc.top - kr.top + cy) + 'px'; v.style.display = 'block';
}
// Kính lúp: phóng chỗ dưới ngón tay lên góc ảnh; ngón tay lại gần góc trái thì kính sang góc phải
function veKinh(cv, cx, cy) {
    const K = $('kinh'), c = K.firstElementChild, x = c.getContext('2d'), rc = cv.getBoundingClientRect(), kr = $('khung').getBoundingClientRect();
    // phóng tối đa 3 lần nhưng vòng cọ luôn nằm gọn trong kính
    const Rc = banKinh(CU) * tiLeCss(cv), nhin = Math.max(40, Math.min(100, Rc * 2.8)), W = c.width, s = cv.width / rc.width, sw = nhin * s;
    x.fillStyle = '#e5e5e5'; x.fillRect(0, 0, W, W);
    x.drawImage(cv, cx * s - sw / 2, cy * s - sw / 2, sw, sw, 0, 0, W, W);
    const rr = Rc * W / nhin;
    x.lineWidth = 4; x.strokeStyle = 'rgba(0,0,0,.5)'; x.beginPath(); x.arc(W / 2, W / 2, rr, 0, 2 * Math.PI); x.stroke();
    x.lineWidth = 2; x.strokeStyle = '#fff'; x.stroke();
    const px = rc.left - kr.left + cx, py = rc.top - kr.top + cy, trai = px < 150 && py < 150;
    K.style.left = trai ? 'auto' : '6px'; K.style.right = trai ? '6px' : 'auto'; K.style.display = 'block';
}
let henAn = 0;
// dấu + ở chỗ đang lấy tóc (toạ độ lớp người -> toạ độ trong khung)
function hienNguon(X, Y, chon) {
    const cv = THE; if (!cv || !cv.__hinh) return;
    const { k, ox, oy } = cv.__hinh(), rc = cv.getBoundingClientRect(), kr = $('khung').getBoundingClientRect(), n = $('nguon');
    n.style.left = (rc.left - kr.left + (ox + X * k) / cv.width * rc.width) + 'px'; n.style.top = (rc.top - kr.top + (oy + Y * k) / cv.height * rc.height) + 'px';
    n.classList.toggle('chon', !!chon); n.style.display = 'block';
}
const anNguon = () => { $('nguon').style.display = 'none'; };
let henNhac = 0;
const nhac = t => { $('nhan').innerText = t; clearTimeout(henNhac); henNhac = setTimeout(() => { $('nhan').innerText = `Ảnh thẻ ${kho}`; }, 3500); };
const anVong = () => { clearTimeout(henAn); $('vong').style.display = 'none'; $('kinh').style.display = 'none'; };
// Kéo thanh cỡ cọ: hiện vòng giữa ảnh cho thấy cọ to bao nhiêu
$('co-cu').oninput = () => {
    coBoi = +$('co-cu').value; if (!CU || !THE || !ANH || !ANH.r) return;
    const rc = THE.getBoundingClientRect(); hienVong(THE, rc.width / 2, rc.height / 2);
    clearTimeout(henAn); henAn = setTimeout(anVong, 900);
};
// Lịch sử: lui = các trạng thái trước (để hoàn tác), toi = các trạng thái đã hoàn tác (để làm lại). Bỏ hết cũng hoàn tác được.
const doiTT = moi => { ANH.tt = moi; ANH._xoa = null; ve(); nutBoi(); };
$('boi-lui').onclick = () => { if (!ANH || !ANH.lui || !ANH.lui.length) return; (ANH.toi = ANH.toi || []).push(ANH.tt || []); doiTT(ANH.lui.pop()); };
$('boi-toi').onclick = () => { if (!ANH || !ANH.toi || !ANH.toi.length) return; (ANH.lui = ANH.lui || []).push(ANH.tt || []); doiTT(ANH.toi.pop()); };
$('boi-het').onclick = () => { if (!ANH || !ANH.tt || !ANH.tt.length) return; (ANH.lui = ANH.lui || []).push(ANH.tt); ANH.toi = []; doiTT([]); };
function ganBoi(cv) {
    cv.classList.toggle('boi', !!CU);
    let net = null, raf = 0;
    const hinh = () => {
        const r = ANH.r, K = KHO[kho], t = thamSo(kho);
        const OW = cv.width, OH = cv.height;   // đúng cỡ ảnh thẻ đang xem (300 hoặc 600dpi)
        const k = (t.dau * OH) / (r.cam - r.dinh); return { k, ox: OW / 2 - r.mat.x * k, oy: t.tren * OH - r.dinh * k };
    };
    cv.__hinh = hinh;   // cho bài kiểm thử
    const doiToaDo = e => {
        const rc = cv.getBoundingClientRect(), { k, ox, oy } = hinh();
        const X = (e.clientX - rc.left) / rc.width * cv.width, Y = (e.clientY - rc.top) / rc.height * cv.height;
        return [(X - ox) / k, (Y - oy) / k];
    };
    let viTri = null;
    const them = e => {
        const rc = cv.getBoundingClientRect(); viTri = [e.clientX - rc.left, e.clientY - rc.top]; hienVong(cv, viTri[0], viTri[1]);
        const [X, Y] = doiToaDo(e), d = net.d, q = d[d.length - 1], tu = d.length;
        // chia nhỏ bước: xoá thì nét đều, kéo thì mỗi bước không quá 1/4 cọ cho mượt
        const buoc = q ? Math.max(1, Math.ceil(Math.hypot(X - q[0], Y - q[1]) / (net.R * (net.loai === 'keo' ? 0.25 : 0.3)))) : 1;
        if (q && Math.hypot(X - q[0], Y - q[1]) < 0.5) return;
        for (let s = 1; s <= buoc; s++) d.push(q ? [q[0] + (X - q[0]) * s / buoc, q[1] + (Y - q[1]) * s / buoc] : [X, Y]);
        rHien(); lamThaoTac(ANH._xoa.x, ANH.r, net, tu);
        if (net.loai === 'va' && net.o) hienNguon(X + net.o[0], Y + net.o[1]);
        if (!raf) raf = requestAnimationFrame(() => { raf = 0; NHANH = true; veTheNhanh(); NHANH = false; if (net && viTri) veKinh(cv, viTri[0], viTri[1]); });
    };
    const ngon = new Map(); let chum = null, choHetNgon = false;
    const huyNet = () => {   // ngón thứ 2 chạm vào: nét của ngón 1 là lỡ, bỏ đi
        if (!net) return; net = null; ANH.tt.pop(); ANH.lui.pop(); ANH._xoa = null; anVong(); veTheNhanh(); nutBoi();
    };
    // giữ ảnh luôn phủ kín khung khi đã phóng
    const gioiHan = () => { const w = cv.offsetWidth, h = cv.offsetHeight; ZOOM.x = Math.min(0, Math.max(w * (1 - ZOOM.s), ZOOM.x)); ZOOM.y = Math.min(0, Math.max(h * (1 - ZOOM.s), ZOOM.y)); };
    const phongTai = (s, mx, my, m0x, m0y, s0, x0, y0) => {
        // điểm ảnh nằm dưới (m0x, m0y) lúc bắt đầu đi theo (mx, my)
        const L = cv.getBoundingClientRect(), Lx = L.left - ZOOM.x, Ly = L.top - ZOOM.y;
        const ux = (m0x - Lx - x0) / s0, uy = (m0y - Ly - y0) / s0;
        ZOOM.s = Math.max(1, Math.min(5, s)); ZOOM.x = mx - Lx - ZOOM.s * ux; ZOOM.y = my - Ly - ZOOM.s * uy;
        if (ZOOM.s <= 1.001) ZOOM = { s: 1, x: 0, y: 0 }; else gioiHan(); apZoom(cv);
    };
    const giua = () => { const [a, b] = [...ngon.values()]; return { x: (a[0] + b[0]) / 2, y: (a[1] + b[1]) / 2, d: Math.hypot(a[0] - b[0], a[1] - b[1]) }; };
    cv.addEventListener('wheel', e => {
        if (!CU || !ANH || !ANH.r) return; e.preventDefault();
        phongTai(ZOOM.s * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY, e.clientX, e.clientY, ZOOM.s, ZOOM.x, ZOOM.y);
    }, { passive: false });
    cv.addEventListener('pointerdown', e => {
        if (!CU || !ANH || !ANH.r || dangChay) return;
        e.preventDefault(); cv.setPointerCapture(e.pointerId);
        ngon.set(e.pointerId, [e.clientX, e.clientY]);
        if (ngon.size >= 2) { huyNet(); const g = giua(); chum = { ...g, s0: ZOOM.s, x0: ZOOM.x, y0: ZOOM.y }; choHetNgon = true; return; }
        if (choHetNgon) return;
        clearTimeout(henAn);
        ANH.tt = ANH.tt || []; (ANH.lui = ANH.lui || []).push(ANH.tt.slice()); ANH.toi = [];
        net = { loai: CU, R: banKinh(CU), d: [] }; ANH.tt.push(net);
        if (ANH._xoa && ANH._xoa.base === ANH.r && ANH._xoa.so === ANH.tt.length - 1) ANH._xoa.so++; else rHien();   // nét mới rỗng: khỏi làm lại các nét cũ
        if (CU === 'va') {
            const [X, Y] = doiToaDo(e);
            // đã chọn tay chỗ lấy tóc: nét đầu tiên đặt khoảng lệch, các nét sau dùng lại (như Clone Stamp)
            if (ANH.vaNguon) { ANH.vaLech = [ANH.vaNguon[0] - X, ANH.vaNguon[1] - Y]; ANH.vaNguon = null; }
            net.o = ANH.vaLech || timNguon(ANH.r, X, Y, net.R);
            giuYen = { x: e.clientX, y: e.clientY, X, Y, hen: setTimeout(() => chonNguon(), 450) };
            if (!net.o) { nhac('Chưa thấy tóc gần đó để lấy. Giữ ngón tay lên chỗ tóc muốn lấy rồi tô lại.'); }
        }
        them(e);
    });
    // giữ yên ngón tay: bỏ nét vừa chấm, lấy chỗ đó làm nguồn tóc
    let giuYen = null;
    const chonNguon = () => {
        if (!giuYen || !net || net.loai !== 'va') return;
        const { X, Y } = giuYen; giuYen = null; huyNet();
        ANH.vaNguon = [X, Y]; ANH.vaLech = null; hienNguon(X, Y, true);
        try { navigator.vibrate && navigator.vibrate(15); } catch (er) {}
        nhac('Đã chọn chỗ lấy tóc. Giờ tô lên chỗ thiếu.');
    };
    cv.addEventListener('pointermove', e => {
        if (ngon.has(e.pointerId)) ngon.set(e.pointerId, [e.clientX, e.clientY]);
        if (chum) { if (ngon.size >= 2) { const g = giua(); phongTai(chum.s0 * g.d / Math.max(1, chum.d), g.x, g.y, chum.x, chum.y, chum.s0, chum.x0, chum.y0); } return; }
        if (giuYen && Math.hypot(e.clientX - giuYen.x, e.clientY - giuYen.y) > 8) { clearTimeout(giuYen.hen); giuYen = null; }
        if (net) return them(e);
        // chuột trên máy tính: vòng cọ đi theo con trỏ
        if (CU && e.pointerType === 'mouse' && ANH && ANH.r) { const rc = cv.getBoundingClientRect(); hienVong(cv, e.clientX - rc.left, e.clientY - rc.top); }
    });
    cv.addEventListener('pointerleave', () => { if (!net) anVong(); });
    const tha = e => {
        ngon.delete(e.pointerId);
        if (ngon.size < 2) chum = null;
        if (!ngon.size) choHetNgon = false;
        if (giuYen) { clearTimeout(giuYen.hen); giuYen = null; }
        if (!net) return; net = null; anVong(); if (!ANH.vaNguon) anNguon(); veTo(); nutBoi();
    };
    cv.addEventListener('pointerup', tha); cv.addEventListener('pointercancel', tha);
}
// Giữ nút so sánh: hiện ảnh lúc vừa xoá phông (chưa sửa tóc, chưa sửa tay), cùng nền cùng khung; buông tay về lại ảnh đã làm
function hienTruoc(on) {
    if (!ANH || !ANH.goc || !THE || dangChay) return;
    $('khung').classList.toggle('truoc', on); $('so-sanh').classList.toggle('on', on);
    if (!on) return veTheNhanh();
    const t = thamSo(kho), m = catThe(ANH.goc, KHO[kho], nen, t.dau, t.tren, dpiXem());
    THE.getContext('2d').drawImage(m, 0, 0); m.width = m.height = 0;
}
{
    const nut = $('so-sanh'); let giu = false;
    nut.addEventListener('pointerdown', e => { e.preventDefault(); nut.setPointerCapture(e.pointerId); giu = true; hienTruoc(true); });
    const tha = () => { if (giu) { giu = false; hienTruoc(false); } };
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(k => nut.addEventListener(k, tha));
    nut.addEventListener('contextmenu', e => e.preventDefault());
}
function veTheNhanh() {
    if (!ANH || !ANH.r || !THE || dangChay) return;
    const moi = theCua(kho, THE.__dpi);
    THE.getContext('2d').drawImage(moi, 0, 0);
    moi.width = moi.height = 0;
}

// ---------- Tờ in nhiều khổ ----------
// SO: số tấm từng khổ. TU_DONG: chưa bấm +/- thì cả tờ là khổ đang chọn, xếp tối đa.
let SO = {}, TU_DONG = true;
function veTo() {
    const cache = {};
    const anh = k => cache[k] || (cache[k] = theCua(k));
    if (TU_DONG || !Object.values(SO).some(v => v > 0)) { SO = { [kho]: xepTo([{ c: anh(kho), so: 99 }]).xep }; }
    const ds = Object.entries(SO).filter(([, v]) => v > 0).map(([k, v]) => ({ c: anh(k), so: v }));
    TO = xepTo(ds);
    $('to-o').innerHTML = ''; TO.c.id = 'to'; $('to-o').appendChild(TO.c);
    // Còn chỗ cho thêm 1 tấm khổ k không
    const conCho = k => xepTo(ds.concat([{ c: anh(k), so: 1 }])).xep > TO.xep;
    $('to-so').innerHTML = Object.keys(KHO).map(k => `<div class="o${SO[k] ? ' co' : ''}"><span>${k}</span>
        <span style="display:flex;align-items:center;gap:6px;"><button type="button" data-k="${k}" data-d="-1" ${SO[k] ? '' : 'disabled'} aria-label="Bớt ${k}">−</button><b>${SO[k] || 0}</b><button type="button" data-k="${k}" data-d="1" ${conCho(k) ? '' : 'disabled'} aria-label="Thêm ${k}">+</button></span></div>`).join('');
    const tong = Object.values(SO).reduce((a, b) => a + b, 0);
    $('to-nhan').innerText = TO.xep < TO.tong ? `Tờ chỉ xếp được ${TO.xep}/${TO.tong} ảnh` : `${tong} ảnh trên một tờ` + (Object.keys(KHO).some(conCho) ? '' : ' · tờ đã đầy');
    Object.values(cache).forEach(c => { if (c !== THE) c.width = c.height = 0; });
    $('to-card').style.display = '';
}
$('to-so').onclick = e => {
    const b = e.target.closest('button[data-k]'); if (!b || b.disabled) return;
    TU_DONG = false;
    SO[b.dataset.k] = Math.max(0, (SO[b.dataset.k] || 0) + +b.dataset.d);
    veTo();

// ---------- Thanh cỡ mặt, khoảng trên đầu ----------
// Đang kéo: vẽ lại ảnh thẻ theo khung hình; buông tay mới vẽ tờ in (nặng hơn)
const nhanThanh = () => {
    const ten = (v, t) => v < -2 ? t[0] : v > 2 ? t[2] : t[1];
    $('v-dau').innerText = ten(+$('dau').value, ['Nhỏ', 'Vừa', 'To']);

$('mac-dinh').onclick = () => { veMacDinh(); ve(); };

// Lưu: điện thoại thì mở bảng chia sẻ (lưu vào Ảnh), máy tính thì tải file
const luu = (c, ten) => c.toBlob(async b => {
    const f = new File([b], ten, { type: 'image/jpeg' });
    try { if (/Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [f] })) return await navigator.share({ files: [f] }); }
    catch (e) { if (e.name === 'AbortError') return; }
    const u = URL.createObjectURL(b); const l = document.createElement('a'); l.href = u; l.download = ten; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 10000);
}, 'image/jpeg', 1);
const tenKho = () => kho.replace('×', 'x');
$('tai-the').onclick = () => THE && luu(THE, `anh-the-${tenKho()}.jpg`);
$('tai-to').onclick = () => TO && luu(TO.c, 'to-in-10x15.jpg');

$('gui').onclick = async () => {
    if (!TO || !NHUNG || choGui) return;
    const btn = $('gui'), cu = btn.innerText;
    btn.disabled = true; btn.innerText = 'Đang chuẩn bị ảnh...';
    try {
        const blob = await new Promise(r => TO.c.toBlob(r, 'image/jpeg', 1));
        if (!blob) throw new Error('Không xuất được tờ in');
        const so = Object.entries(SO).filter(([, v]) => v > 0).map(([k, v]) => `${v} ảnh ${k}`).join(', ');
        btn.innerText = 'Đang gửi...';

    } catch (e) { $('to-nhan').innerText = e.message; }

};


// Cho kịch bản thử tự động (vẫn nhận nhiều ảnh: làm lần lượt, giữ kết quả từng ảnh)
const DS = [];
window.__ANH = DS;
window.__them = async files => { for (const f of files) { chonAnh(f); while (dangChay || !ANH.r && !ANH.loi) await new Promise(r => setTimeout(r, 100)); DS.push(ANH); } };
window.__chon = i => { ANH = DS[i]; ve(); }; window.__hien = () => ANH;
